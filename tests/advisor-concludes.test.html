<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tests — un tour du conseiller qui conclut</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; background: #101615; color: #DDE6E3; margin: 0; padding: 24px; }
  h1 { font-size: 16px; color: #9FF0D2; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; color: #7C8A88; font-size: 12.5px; }
  #summary { font-weight: 700; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }
  .ok   { background: #0E3B2E; color: #6EE7B7; }
  .fail { background: #45201C; color: #FCA5A5; }
  li { margin: 3px 0; list-style: none; }
  li.p::before { content: "PASS  "; color: #6EE7B7; font-weight: 700; }
  li.f::before { content: "FAIL  "; color: #FCA5A5; font-weight: 700; }
  li.f { color: #FCA5A5; }
  .why { color: #93A19E; padding-left: 46px; font-size: 12px; }
  ul { padding: 0; margin: 0; }
</style>
</head>
<body>
<h1>Un tour du conseiller qui conclut</h1>
<p class="sub">
  Une réponse du conseiller sans produit, marquée
  <code>meta.conversation_continues: false</code>, referme le tour : relance
  « une autre recherche ? », puis nouvelle session. Une réponse qui attend le
  client ne relance rien.
</p>
<div id="summary">Exécution…</div>
<ul id="out"></ul>

<script>
const results = [];
function check(name, cond, why) { results.push({ name, ok: !!cond, why: cond ? '' : (why || '') }); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 3000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { if (fn()) return true; await sleep(16); }
  return false;
}

try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}

const searchCalls = [];
const answer = (message, continues) => ({
  type: 'clarification',
  message,
  clarification: { field: 'advice', question: message, options: [] },
  interpreted: { manufacturer: null, model: null, year: null, part_type: null },
  meta: { advisor: { skill: 'battery-powersport', action: 'answer' }, conversation_continues: continues },
});
const replies = [
  answer('Une lithium se charge avec un chargeur compatible. Vous en avez déjà un ?', true),
  answer('Activez-la avec le pack acide fourni, et laissez-la reposer 60 minutes avant de la monter.', false),
  answer('Une autre question ?', true),
];

window.fetch = async (url, opts = {}) => {
  const u = String(url);
  if (/\/events$/.test(u) || /\/review$/.test(u)) {
    return { status: 201, ok: true, headers: new Headers(), json: async () => ({ ok: true, meta: {} }) };
  }
  if (/\/search$/.test(u)) {
    searchCalls.push(JSON.parse(opts.body));
    const reply = replies[searchCalls.length - 1];
    return { status: 200, ok: true, headers: new Headers(), json: async () => reply };
  }
  return { status: 404, ok: false, headers: new Headers(), json: async () => ({}) };
};

async function run() {
  const host = [...document.querySelectorAll('*')].find(e => e.shadowRoot);
  if (!host) { check('widget monté', false, 'aucun shadow root'); return done(); }
  const shadow = host.shadowRoot;
  const $  = s => shadow.querySelector(s);
  const $$ = s => [...shadow.querySelectorAll(s)];
  const afterResult = 'Souhaitez-vous faire une autre recherche ?';
  const relaunches = () => $$('.ep-msg-assistant .ep-bubble').filter(b => b.textContent.trim() === afterResult).length;
  const send = text => {
    const input = $('#ep-input');
    input.value = text;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    $('#ep-send-btn').click();
  };

  $('#ep-fab').click();
  await until(() => !$('#ep-window').classList.contains('ep-hidden'), 2000);

  send('comment charger une lithium ?');
  await until(() => searchCalls.length === 1, 3000);
  await sleep(15000);
  check('une réponse qui attend le client ne relance rien', relaunches() === 0, `${relaunches()} relance(s)`);

  send('non, et comment activer une DRY ?');
  await until(() => searchCalls.length === 2, 3000);
  await until(() => relaunches() === 1, 5000);
  check('une réponse qui conclut referme le tour par la relance', relaunches() === 1, `${relaunches()} relance(s)`);
  check('la relance suit la réponse', $$('.ep-msg-assistant .ep-bubble').pop().textContent.trim() === afterResult);

  send('une autre question');
  await until(() => searchCalls.length === 3, 3000);
  check('le message suivant part sous une NOUVELLE session',
        searchCalls[2] && searchCalls[2].session_id !== searchCalls[1].session_id,
        `${searchCalls[1] && searchCalls[1].session_id} → ${searchCalls[2] && searchCalls[2].session_id}`);
  check('les deux premiers tours partageaient la même session',
        searchCalls[1] && searchCalls[1].session_id === searchCalls[0].session_id);

  done();
}

function done() {
  const bad = results.filter(r => !r.ok);
  const s = document.getElementById('summary');
  s.className = bad.length ? 'fail' : 'ok';
  s.textContent = bad.length ? `${bad.length} ÉCHEC(S) sur ${results.length}` : `${results.length} tests OK`;
  document.getElementById('out').innerHTML = results.map(r =>
    `<li class="${r.ok ? 'p' : 'f'}">${r.name}</li>` + (r.ok ? '' : `<div class="why">↳ ${r.why}</div>`)
  ).join('');
  window.__EP_TEST__ = { total: results.length, failed: bad.length, failures: bad };
}

window.addEventListener('error', e => { check('erreur JS non capturée', false, e.message); done(); });
setTimeout(() => run().catch(e => { check('exception dans le scénario', false, e && e.message); done(); }), 300);
</script>

<script
  src="../everyparts-widget.js"
  data-token="ep_live_ADVISOR_END_TOKEN"
  data-locale="fr-FR"
  data-position="bottom-right"
  data-api="https://api.test.local/api/v1"
  defer></script>
</body>
</html>
